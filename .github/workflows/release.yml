name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: commit
        run: |
          git merge-base --is-ancestor HEAD origin/main
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: ci
        uses: actions/github-script@v8
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await require('./.github/scripts/release-source.cjs').findSource({ github, context, core });

  verify:
    needs: source
    if: needs.source.outputs.run_id == ''
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  publish:
    needs: [source, verify]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.source.outputs.run_id != '' || needs.verify.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: android-apks
          path: dist
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifacts
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Verify commit, version and toolchain
        uses: actions/github-script@v8
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        with:
          script: |
            const fs = require('node:fs');
            const info = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
            const image = fs.readFileSync('docker/android/image.txt', 'utf8').trim();
            if (info.commit !== process.env.RELEASE_COMMIT || info.image !== image ||
                'v' + info.versionName !== context.ref.replace('refs/tags/', '')) {
              throw new Error('Artifact provenance does not match release commit/version/image');
            }
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/debug/app-debug.apk dist/SHA256SUMS dist/build-info.json \
            --verify-tag --title "ShiYin $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
