name: Build Image

on:
  push:
    branches: [dev, main]
    paths:
      - docker/android/Dockerfile
      - docker/android/entrypoint.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: android-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish toolchain
        id: image
        uses: docker/build-push-action@v6
        with:
          context: docker/android
          platforms: linux/amd64
          push: true
          tags: ghcr.io/huffer342-wsh/shiyin-build:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Huffer342-WSH/ShiYin
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/huffer342-wsh/shiyin-build@%s\n' "$IMAGE_DIGEST" > image.txt
      - uses: actions/upload-artifact@v6
        with:
          name: android-build-image
          path: image.txt
          retention-days: 30
